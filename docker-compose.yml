services:
  postgres:
    # Digest-pinned: tag drift must be a deliberate, reviewable change.
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: mezo-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mezo}
      # Required, not defaulted: a missing .env must fail loudly, not boot a
      # known-password database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-mezo_monitor}
    ports:
      # Bound to loopback: the host has a public IP and no firewall, so an
      # unqualified "5432:5432" publishes Postgres to the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - mezo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mezo} -d ${POSTGRES_DB:-mezo_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mezo_pgdata:
