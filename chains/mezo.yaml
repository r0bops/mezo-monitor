# Mezo mainnet — CometBFT-family chain config.
#
# RPC endpoints are interpolated from the environment (${VAR}) so that
# node URLs / secrets never live in this file. Values come from .env
# (MEZO_RPC_URL, MEZO_RPC_WS_URL).
#
# This file + the generic CometBFT adapter is the ENTIRE Mezo-specific
# surface. Adding another Cosmos/CometBFT chain = one new YAML file.

slug: mezo-mainnet
name: Mezo Mainnet
chain_id: mezo_31612-1
family: cometbft

# Primary endpoint. Kept for backwards compatibility and used as the fallback
# when no `endpoints` list is present.
rpc_url: ${MEZO_RPC_URL}
ws_url: ${MEZO_RPC_WS_URL}

# Cosmos LCD base URL. Mezo's custom x/poa module serves validator monikers
# and keybase identities at {lcd}/poa/v1/validators — the CometBFT RPC cannot.
# Mezo's REST API is disabled by default on nodes, so public LCDs are rare;
# the indexer tries these in order (preferring whichever answered last), and
# an unset ${VAR} is skipped with a warning.
lcd_url: ${MEZO_LCD_URL}

# LCD failover list. No second public Mezo LCD is currently known — the slot
# below is intentionally unset. Set MEZO_LCD_URL_2 in .env the moment one
# appears and moniker/logo sync survives a provider outage.
lcd_urls:
  - ${MEZO_LCD_URL}
  - ${MEZO_LCD_URL_2}

# Failover list, tried in priority order (lower wins). The indexer probes each
# on an interval and switches automatically when the active one degrades; a
# node pinned from the dashboard overrides that until unpinned.
# Endpoints whose ${VAR} is unset are skipped with a warning.
# Labels carry the operator's name, not the role: the primary is Pathrock
# Network's own archive node (moniker "mezo-archive-01" in /status), the
# others are named for the provider domain.
endpoints:
  - label: Pathrock Network
    rpc_url: ${MEZO_RPC_URL}
    ws_url: ${MEZO_RPC_WS_URL}
    priority: 10
  - label: Lavender.Five
    rpc_url: ${MEZO_RPC_URL_2}
    ws_url: ${MEZO_RPC_WS_URL_2}
    priority: 20
  - label: NodesHub
    rpc_url: ${MEZO_RPC_URL_3}
    ws_url: ${MEZO_RPC_WS_URL_3}
    priority: 30

# Outbound deep-links only (tx-level explorer). Never indexed here.
blockscout_url: https://explorer.mezo.org

capabilities:
  delegations: false
  governance: false
  slashing: false
  poa: true
